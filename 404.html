<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생마술 | 페이지를 찾을 수 없습니다</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/assets/images/favicon.png">
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="인생마술">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        body {
            background: #0a0812;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: var(--font-sans, 'Noto Sans KR', sans-serif);
        }
        .not-found-wrap {
            text-align: center;
            padding: 40px 24px;
        }
        .not-found-code {
            font-size: clamp(5rem, 20vw, 9rem);
            font-weight: 700;
            background: linear-gradient(135deg, #d4af37, #f5e17a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.2em;
        }
        .not-found-title {
            color: #fff;
            font-size: 1.4rem;
            margin-bottom: 0.6em;
        }
        .not-found-desc {
            color: rgba(255,255,255,0.5);
            font-size: 0.95rem;
            margin-bottom: 2em;
            line-height: 1.7;
        }
        .not-found-btn {
            display: inline-block;
            padding: 14px 36px;
            border: 1.5px solid #d4af37;
            color: #d4af37;
            border-radius: 40px;
            text-decoration: none;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .not-found-btn:hover {
            background: rgba(212, 175, 55, 0.15);
        }
    </style>
</head>
<body>
    <div class="not-found-wrap">
        <div class="not-found-code">404</div>
        <h1 class="not-found-title">페이지를 찾을 수 없습니다</h1>
        <p class="not-found-desc">요청하신 페이지가 존재하지 않거나 이동되었습니다.<br>주소를 다시 확인해 주세요.</p>
        <a href="/" class="not-found-btn">홈으로 돌아가기</a>
    </div>
    <!-- Naver Analytics -->
    <script type="text/javascript" src="//wcs.pstatic.net/wcslog.js"></script>
    <script type="text/javascript">
        if (!wcs_add) var wcs_add = {};
        wcs_add["wa"] = "250747e68bb3700";
        if (window.wcs) {
            wcs_do();
        }
    </script>
</body>
</html>
